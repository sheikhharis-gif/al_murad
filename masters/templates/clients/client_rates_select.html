{% extends "base.html" %}

{% block content %}

        <h3 class="fw-bold text-dark mb-1"><i class="bi bi-cash-stack text-primary me-2"></i>Client Rates</h3>
        <p class="text-muted small">Search a Client to view and manage its fuel-price-indexed route rates.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm rounded-4 p-4">
                <label class="form-label fw-bold">Client</label>
                {% include "clients/_client_search_picker.html" with picker_url_name="client_rates" %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
